---
- name: Install Waydroid packages
  ansible.builtin.dnf:
    name: "{{ waydroid_packages }}"
    state: present
  become: true

- name: Check whether Waydroid is initialized
  ansible.builtin.stat:
    path: /var/lib/waydroid/waydroid.cfg
  register: waydroid_config

- name: Initialize Waydroid with Google apps
  ansible.builtin.command: waydroid init -s GAPPS
  become: true
  when: not waydroid_config.stat.exists

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  become: true

- name: Enable and start the Waydroid container
  ansible.builtin.systemd:
    name: waydroid-container
    enabled: true
    state: started
  become: true

- name: Trust the Waydroid network interface
  ansible.posix.firewalld:
    zone: trusted
    interface: waydroid0
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Enable NAT for Waydroid
  ansible.posix.firewalld:
    zone: trusted
    masquerade: true
    permanent: true
    immediate: true
    state: enabled
  become: true

- name: Check for Waydroid outbound policy
  ansible.builtin.command: >-
    firewall-cmd --permanent --info-policy=waydroid-to-world
  register: waydroid_firewall_policy
  changed_when: false
  failed_when: false
  become: true

- name: Create Waydroid outbound policy
  ansible.builtin.command: >-
    firewall-cmd --permanent --new-policy=waydroid-to-world
  when: waydroid_firewall_policy.rc != 0
  notify: Reload firewalld
  become: true

- name: Read Waydroid outbound policy settings
  ansible.builtin.command: "{{ item.command }}"
  loop:
    - name: ingress
      command: firewall-cmd --permanent --policy=waydroid-to-world --list-ingress-zones
    - name: egress
      command: firewall-cmd --permanent --policy=waydroid-to-world --list-egress-zones
    - name: target
      command: firewall-cmd --permanent --policy=waydroid-to-world --get-target
    - name: masquerade
      command: firewall-cmd --permanent --policy=waydroid-to-world --query-masquerade
  loop_control:
    label: "{{ item.name }}"
  register: waydroid_firewall_policy_settings
  changed_when: false
  failed_when: false
  become: true

- name: Configure Waydroid outbound policy
  ansible.builtin.command: "{{ item.command }}"
  loop:
    - name: ingress
      command: firewall-cmd --permanent --policy=waydroid-to-world --add-ingress-zone=trusted
      configured: "{{ 'trusted' in waydroid_firewall_policy_settings.results[0].stdout.split() }}"
    - name: egress
      command: firewall-cmd --permanent --policy=waydroid-to-world --add-egress-zone=ANY
      configured: "{{ 'ANY' in waydroid_firewall_policy_settings.results[1].stdout.split() }}"
    - name: target
      command: firewall-cmd --permanent --policy=waydroid-to-world --set-target=ACCEPT
      configured: "{{ waydroid_firewall_policy_settings.results[2].stdout == 'ACCEPT' }}"
    - name: masquerade
      command: firewall-cmd --permanent --policy=waydroid-to-world --add-masquerade
      configured: "{{ waydroid_firewall_policy_settings.results[3].rc == 0 }}"
  loop_control:
    label: "{{ item.name }}"
  when: not item.configured
  notify: Reload firewalld
  become: true

- name: Install Waydroid Docker firewall helper
  ansible.builtin.copy:
    src: waydroid-docker-firewall
    dest: /usr/local/libexec/waydroid-docker-firewall
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart Waydroid Docker firewall

- name: Install Waydroid Docker firewall service
  ansible.builtin.copy:
    src: waydroid-docker-firewall.service
    dest: /etc/systemd/system/waydroid-docker-firewall.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart Waydroid Docker firewall

- name: Enable and start Waydroid Docker firewall service
  ansible.builtin.systemd:
    name: waydroid-docker-firewall
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Stow Waydroid launchers
  ansible.builtin.command: stow -R waydroid
  args:
    chdir: "{{ dotfiles_dir }}"
  register: waydroid_stow_result
  changed_when: waydroid_stow_result.rc == 0

- name: Refresh the desktop application database
  ansible.builtin.command: >-
    update-desktop-database
    {{ ansible_facts.env.HOME }}/.local/share/applications
  changed_when: false
  failed_when: false
