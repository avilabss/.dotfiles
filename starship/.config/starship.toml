"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$docker_context\
$cmd_duration\
$fill\
$time\
$battery\
$line_break\
$character"""

palette = 'ayu_dark'

[os]
disabled = false
style = "fg:blue"
format = "[$symbol ]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:foreground"
style_root = "bold fg:red"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:foreground"
format = '[@$hostname]($style)'

[directory]
style = "bold fg:gold"
format = " [in](fg:muted) [$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:blue"
format = ' [│](fg:muted) [$symbol $branch]($style)'

[git_status]
style = "fg:red"
format = ' [$all_status$ahead_behind]($style)'

[nodejs]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[c]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[rust]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[golang]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[php]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[java]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[kotlin]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[haskell]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)]($style)'

[python]
symbol = ""
style = "fg:foreground"
format = ' [│](fg:muted) [$symbol( $version)(\(#$virtualenv\))]($style)'

[docker_context]
symbol = ""
style = "fg:blue"
format = ' [│](fg:muted) [$symbol( $context)]($style)'

[conda]
symbol = ""
style = "fg:purple"
format = ' [│](fg:muted) [$symbol $environment]($style)'
ignore_base = false

[fill]
symbol = " "
style = "fg:muted"

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:foreground"
format = '[](fg:muted) [$time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:purple)'
vimcmd_replace_symbol = '[❮](bold fg:purple)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " [│](fg:muted) [ in $duration]($style)"
style = "fg:muted"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰁽 "
empty_symbol = "󰂎 "
disabled = false
format = " [$symbol$percentage]($style)"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

[palettes.ayu_dark]
background = "#0b0e14"
foreground = "#bfbdb6"
red = "#f07178"
orange = "#ff8f40"
yellow = "#ffb454"
green = "#aad94c"
blue = "#59c2ff"
purple = "#d2a6ff"
gold = "#e6b450"
muted = "#565b66"
