# ============================================
# General Settings
# ============================================

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Address vim mode switching delay
set -s escape-time 0

# Increase tmux messages display duration
set -g display-time 4000

# Refresh status line more often
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# ============================================
# Key Bindings
# ============================================

# Change prefix from C-b to C-a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Vim-like pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi mode
set-window-option -g mode-keys vi

# Vi mode copy bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================
# Theme - Ayu Dark
# ============================================

set -g status-style "bg=#0b0e14,fg=#bfbdb6"
set -g message-style "bg=#e6b450,fg=#0b0e14"
set -g mode-style "bg=#e6b450,fg=#0b0e14"
set -g pane-border-style "fg=#11151c"
set -g pane-active-border-style "fg=#59c2ff"

# Rounded powerline windows continue to show each window's name.
set -g window-status-separator ""
set -g window-status-format "#[fg=#11151c,bg=#0b0e14]#[fg=#bfbdb6,bg=#11151c] #W #[fg=#11151c,bg=#0b0e14]"
set -g window-status-current-format "#[fg=#e6b450,bg=#0b0e14]#[fg=#0b0e14,bg=#e6b450,bold] #W #[fg=#e6b450,bg=#0b0e14]"

# Status bar configuration
set -g status-left-length 100
set -g status-right-length 140
set -g status-left ""
set -g status-right "#[fg=#59c2ff]#{pane_current_command} #[fg=#565b66]│ #[fg=#aad94c]CPU #(value=`~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh 2>/dev/null`; if [ -n \"\$value\" ]; then printf '%s' \"\$value\"; else printf 'N/A'; fi) #[fg=#565b66]│ #[fg=#ffb454]#S #[fg=#565b66]│ #[fg=#d2a6ff]#(uptime | sed -E 's/^.* up +//; s/, +[0-9]+ users?.*$//; s/, +load averages?:.*$//') #[fg=#565b66]│ #[fg=#f07178]BAT #(value=`~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh 2>/dev/null`; if [ -n \"\$value\" ]; then icon=`~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh 2>/dev/null`; printf '%s %s' \"\$icon\" \"\$value\"; else printf 'N/A'; fi) "

# ============================================
# Plugins (using TPM - Tmux Plugin Manager)
# ============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugins for status bar values
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
